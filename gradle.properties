org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / loader
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.248
neo_version_range=[21.1.219,)
loader_version_range=[4,)

# Mappings
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Mod metadata
mod_id=createworkers
mod_name=Create: Workers
mod_license=MIT
mod_version=0.1.0
mod_group_id=com.createworkers
mod_authors=Steal-My-Mods
mod_description=Put a hard hat on a villager or an enderman and they will haul items around your factory like a Mechanical Arm.

# Dependencies
create_version=6.0.11-300
create_version_range=[6.0.0,7.0)

# Publishing. The project id is a public identifier, not a secret -- the upload token lives in
# the repo's Actions secrets as CURSEFORGE_TOKEN. Only `publishMods` reads any of this; an
# ordinary build ignores it.
curseforge_project_id=1662272
# Modrinth is not a destination yet (CLAUDE.md, Distribution). The project and the
# `create-workers` slug are already reserved, so restoring it needs no new registration:
# modrinth_project_id=BH1t0OBm
github_repository=Steal-My-Mods/create-workers
