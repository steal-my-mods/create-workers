name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      # GameTests are the real check for this mod -- there is no unit-test suite. The run
      # directory is gitignored, so the server needs its EULA accepting on a fresh checkout.
      - name: Accept the EULA for the test server
        run: |
          mkdir -p run-gametest
          echo 'eula=true' > run-gametest/eula.txt

      - name: GameTests
        run: ./gradlew runGameTestServer

      # The badge and the Ponder structure are generated, so a stale checked-in file is a real
      # defect -- it would ship in the jar. Regenerating must be a no-op; if it is not, someone
      # edited a generated file by hand or changed a generator and forgot to re-run it.
      - name: Generated assets are up to date
        run: |
          python3 tools/generate_logo.py
          python3 tools/generate_logo.py branding/icon-512.png --size 512
          python3 tools/generate_ponder_structure.py
          python3 tools/generate_worker_profession.py
          # Staged, not a bare diff: a generator that starts emitting a new file nobody committed
          # leaves it untracked, and `git diff` says nothing about untracked files.
          git add -A
          git diff --cached --exit-code

      - name: Upload the jar
        uses: actions/upload-artifact@v5
        with:
          name: createworkers-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload server logs if the tests failed
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gametest-logs
          path: run-gametest/logs/
          if-no-files-found: ignore
